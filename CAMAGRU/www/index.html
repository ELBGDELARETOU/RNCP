    <style>
        @font-face {
            font-family: "MaPolice";
            src: url("./fonts/KyrillaSansSerif-Black.ttf") format("truetype");
        }
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "MaPolice";
            background-color: #f5f5f5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2px;
            padding-bottom: 80px;
        }

        .grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .bottom-bar {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 20px;
                
            /* Effet glass */
            background-color: rgba(255, 255, 255, 0.2); /* semi-transparent */
            backdrop-filter: blur(10px); /* flou derrière l'élément */
            -webkit-backdrop-filter: blur(10px); /* pour Safari */
            box-shadow: 0 4px 30px rgba(0,0,0,0.1); /* ombre douce */
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgb(0, 0, 0);
        }

        .button {
            padding: 8px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .button-link {
            text-decoration: none;
            color: inherit;
            display: flex;
        }

    </style>
</head>
